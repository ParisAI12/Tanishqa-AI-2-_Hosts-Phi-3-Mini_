<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tanishqa AI 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f0a1f;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 30px 16px;
      background: #1a1333;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #3b2a66;
      box-shadow: 0 0 40px rgba(255, 0, 200, 0.15);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      font-size: 1.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #ff4dc4, #7f5cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4dc4, #7f5cff);
      box-shadow: 0 0 10px #ff4dc4;
    }

    #chat {
      margin-top: 20px;
      border-radius: 14px;
      border: 1px solid #3b2a66;
      padding: 16px;
      min-height: 260px;
      max-height: 450px;
      overflow-y: auto;
      background: #120d26;
    }

    .message {
      margin-bottom: 14px;
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    .bubble {
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 80%;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #7f5cff;
      margin-left: auto;
      color: white;
      box-shadow: 0 0 10px rgba(127, 92, 255, 0.4);
    }

    .assistant .bubble {
      background: #1e163d;
      border: 1px solid #3b2a66;
      margin-right: auto;
    }

    .role {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    form {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #3b2a66;
      padding: 12px;
      font-size: 1rem;
      background: #120d26;
      color: #f1f5f9;
      resize: vertical;
      min-height: 80px;
    }

    textarea:focus {
      outline: 2px solid #ff4dc4;
      border-color: #ff4dc4;
    }

    button {
      align-self: flex-end;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #ff4dc4, #7f5cff);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 0 10px rgba(255, 0, 200, 0.3);
    }

    #status {
      font-size: 0.85rem;
      opacity: 0.7;
      min-height: 20px;
    }

    .typing {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #ff4dc4;
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1><span class="logo"></span> Tanishqa AI 💖</h1>

    <p style="opacity:0.7;margin-top:6px;font-size:1rem;">
      <strong>TANISHQA I'M SORRY FOR THIS FORGIVE ME</strong>
    </p>

    <div id="chat"></div>

    <form id="chat-form">
      <textarea id="question" placeholder="Ask Tanishqa AI something..."></textarea>
      <button type="submit">Send 💖</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    const chatDiv = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const statusDiv = document.getElementById("status");
    const sendButton = form.querySelector("button");

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "message " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const roleLabel = document.createElement("div");
      roleLabel.className = "role";
      roleLabel.textContent = role === "user" ? "You" : "Tanishqa AI 💖";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.appendChild(roleLabel);
      bubble.appendChild(content);
      wrapper.appendChild(bubble);
      chatDiv.appendChild(wrapper);

      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function showTyping() {
      statusDiv.innerHTML = `
        <span class="typing"></span>
        <span class="typing"></span>
        <span class="typing"></span>
        Tanishqa AI is thinking...
      `;
    }

    function hideTyping() {
      statusDiv.textContent = "";
    }

    async function askCuteAI(question) {
      showTyping();
      sendButton.disabled = true;

      try {
        const response = await fetch(
          "https://api-inference.huggingface.co/models/microsoft/Phi-3-mini-4k-instruct",
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer 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",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              inputs: `You are Tanishqa AI 💖. Speak in a cute, affectionate tone with heart emojis.\nUser: ${question}\nTanishqa AI 💖:`
            })
          }
        );

        const data = await response.json();
        return data[0]?.generated_text || "Aww sweetie 💖 something went wrong.";
      } catch (err) {
        console.error(err);
        return "Error 3001, failed to connect to ParisAI servers";
      } finally {
        hideTyping();
        sendButton.disabled = false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      addMessage("user", question);
      questionInput.value = "";

      const answer = await askCuteAI(question);
      addMessage("assistant", answer);
    });
  </script>
</body>
</html>
